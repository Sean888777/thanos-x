name: Thanos X Radar

on:
  schedule:
    - cron: "0 22 * * 1-5"   # UTC 22:00 = 台灣 06:00（美股收盤後），週一至週五
  workflow_dispatch:         # 允許手動執行
    inputs:
      backfill_days:
        description: "回顧測試天數（例如 120）。留空＝一般每日執行"
        required: false
        default: ""
      oos_range:
        description: "樣本外測試區間（例如 2021-12-15 2026-03-31）。留空＝不執行"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行雷達
        run: |
          if [ -n "${{ github.event.inputs.oos_range }}" ]; then
            python radar.py --oos ${{ github.event.inputs.oos_range }}
          elif [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            python radar.py --backfill "${{ github.event.inputs.backfill_days }}"
          else
            python radar.py
          fi

      - name: 寫回資料（失敗時也寫，網站才會顯示「資料未更新」）
        if: always()
        run: |
          git config user.name "thanos-x-radar"
          git config user.email "thanos-x-radar@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "radar $(date -u +%Y-%m-%d)"
          git push
